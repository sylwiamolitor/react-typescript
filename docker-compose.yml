version: '3.7'

services:

  frontend:
    container_name: react
    build:
      context: ./frontend
      dockerfile: ./src/Dockerfile
    volumes:
      - '.:/frontend/react-typescript'
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - appnet
    depends_on:
      - backend
  backend:
    container_name: api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL_2=Host=postgres;Port=5432;Database=${DATABASE_NAME};Username=${DATABASE_USERNAME};Password=${DATABASE_PASSWORD}
    networks:
      - appnet
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: postgres_react
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
