version: '3.7'

services:

  frontend:
    container_name: react
    build: ./src
    volumes:
      - '.:/react-typescript'
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - appnet
    depends_on:
      - backend
  backend:
    container_name: api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
